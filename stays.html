    :root {

    nav a { text-decoration: none; color: #fff; margin-left: 40px; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; transition: color 0.3s; }
    nav a:hover { color: var(--gold); }

    /* Page Header */
    .page-header { text-align: center; padding: 60px 20px 30px; }
    .page-header h1 { font-size: 42px; margin-bottom: 15px; }
    .page-header p { color: var(--text-light); max-width: 650px; margin: 0 auto; font-size: 16px; }

    /* Breadcrumbs */
    .breadcrumbs {
        text-align: center;
        margin-bottom: 30px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 700;
        color: var(--text-light);
        display: none;
    }
    .breadcrumbs span { cursor: pointer; transition: color 0.3s; }
    .breadcrumbs span:hover { color: var(--gold); }
    .breadcrumbs .current { color: var(--charcoal); cursor: default; }

    /* Content Container */
    .content-container {
        max-width: 1200px;
        margin: 0 auto 100px;
        padding: 0 20px;
    }

    /* Drill-Down Tiles */
    .tile-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 30px;
    }

    .nav-tile {
        height: 300px;
        background-size: cover;
        background-position: center;
        position: relative;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        transition: transform 0.4s ease;
    }
    .nav-tile::before {
        content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.45); transition: background 0.4s ease;
    }
    .nav-tile:hover { transform: translateY(-8px); }
    .nav-tile:hover::before { background: rgba(0,0,0,0.25); }
    
    .nav-tile h2 {
        position: relative;
        color: #fff;
        font-size: 28px;
        text-transform: uppercase;
        letter-spacing: 3px;
        text-align: center;
        padding: 0 20px;
    }

    /* Controls Bar (City Filter Pills & Search) */
    .controls-bar {
        display: none;
        background: #fff;
        padding: 25px 30px;
        margin-bottom: 40px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.03);
        border-top: 3px solid var(--gold);
        gap: 20px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
    }

    .city-pills {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
    }
    .city-pill {
        background: #f4f4f4;
        border: 1px solid var(--border-color);
        padding: 8px 16px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 700;
        color: var(--text-dark);
    }
    .city-pill:hover, .city-pill.active {
        background: var(--charcoal);
        color: #fff;
        border-color: var(--charcoal);
    }

    .search-box {
        position: relative;
        min-width: 250px;
    }
    .search-box input {
        width: 100%;
        padding: 10px 15px 10px 35px;
        border: 1px solid var(--border-color);
        font-family: 'Lato', sans-serif;
        font-size: 13px;
        outline: none;
        box-sizing: border-box;
    }
    .search-box::before {
        content: '🔍';
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 12px;
    }

    .hotel-grid {
        display: none;

        gap: 40px;
    }

        background: #fff;

        background-position: center;
        position: relative;
    }
    .card-badge {

        font-size: 12px;
        color: #555;

        tileGrid.style.display = "grid";
        hotelGrid.style.display = "none";
        controlsBar.style.display = "none";
        noResultsMsg.style.display = "none";
        
        breadcrumbs.style.display = "block";
        document.getElementById('crumb-separator').style.display = "inline";
        document.getElementById('crumb-zone').style.display = "inline";
        document.getElementById('crumb-zone').innerText = zoneName;
        document.getElementById('crumb-zone').className = "current";
        document.getElementById('crumb-separator-2').style.display = "none";
        document.getElementById('crumb-region').style.display = "none";
        
        mainTitle.innerText = `Destinations in ${zoneName}`;

        let filteredRegions = regions.filter(r => r.zone === zoneName);
        let html = "";
        filteredRegions.forEach(region => {
            html += `<div class="nav-tile" style="background-image: url('${region.image}')" onclick="loadHotels('${region.name}')">
                        <h2>${region.name}</h2>
                     </div>`;
        });
        tileGrid.innerHTML = html;
    }

    function loadHotels(regionName) {
        currentRegion = regionName;
        selectedCity = "all";
        tileGrid.style.display = "none";
        hotelGrid.style.display = "grid";
        controlsBar.style.display = "flex";
        
        document.getElementById('crumb-zone').className = "";
        document.getElementById('crumb-separator-2').style.display = "inline";
        document.getElementById('crumb-region').style.display = "inline";
        document.getElementById('crumb-region').innerText = regionName;
        
        mainTitle.innerText = `Luxury Stays in ${regionName}`;

        let regionHotels = hotels.filter(h => h.region.toLowerCase() === regionName.toLowerCase());
        let cities = [...new Set(regionHotels.map(h => h.city))].sort();

        let pillsHtml = `<div class="city-pill active" onclick="selectCity('all', this)">All Cities</div>`;
        cities.forEach(city => {
            pillsHtml += `<div class="city-pill" onclick="selectCity('${city}', this)">${city}</div>`;
        });
        cityPillsContainer.innerHTML = pillsHtml;

        renderHotelCards(regionHotels);
    }

    function selectCity(cityName, element) {
        selectedCity = cityName;
        document.querySelectorAll('.city-pill').forEach(p => p.classList.remove('active'));
        element.classList.add('active');
        filterHotels();
    }

    function filterHotels() {
        let query = document.getElementById('hotel-search').value.toLowerCase();
        let regionHotels = hotels.filter(h => h.region.toLowerCase() === currentRegion.toLowerCase());
        
        let filtered = regionHotels.filter(h => {
            let matchesCity = (selectedCity === 'all' || h.city.toLowerCase() === selectedCity.toLowerCase());
            let matchesSearch = (
                h.name.toLowerCase().includes(query) || 
                h.city.toLowerCase().includes(query) || 
                h.badge.toLowerCase().includes(query) ||
                h.basis.toLowerCase().includes(query) ||
                h.pros.some(p => p.toLowerCase().includes(query)) ||
                h.cons.some(c => c.toLowerCase().includes(query))
            );
            return matchesCity && matchesSearch;
        });

        renderHotelCards(filtered);
    }

    function renderHotelCards(list) {
        let html = "";
        if (list.length === 0) {
            hotelGrid.style.display = "none";
            noResultsMsg.style.display = "block";
            return;
        }

        hotelGrid.style.display = "grid";
        noResultsMsg.style.display = "none";

        list.forEach(hotel => {
            let prosHtml = hotel.pros.map(p => `<li>${p}</li>`).join('');
            let consHtml = hotel.cons.map(c => `<li>${c}</li>`).join('');
            
            // Check if basis/stay verification note exists
            let basisHtml = "";
            if (hotel.basis && hotel.basis.toLowerCase() !== 'nan' && hotel.basis.trim() !== '') {
                basisHtml = `<div class="stay-verification">✨ ${hotel.basis}</div>`;
            }

            html += `
                <div class="hotel-card">
                    <div class="card-img" style="background-image: url('${hotel.image}');">
                        <div class="card-badge">${hotel.badge}</div>
                    </div>
                    <div class="card-content">
                        <h3>${hotel.name}</h3>
                        <div class="card-location">📍 ${hotel.city}, ${hotel.region}</div>
                        
                        ${basisHtml}

                        <div class="pros-cons-container">
                            <div class="pros-section">
                                <div class="section-title pros-title">Why We Love It</div>
                                <ul class="pros-list">${prosHtml}</ul>
                            </div>
                            <div class="cons-section">
                                <div class="section-title cons-title">Good to Know</div>
                                <ul class="cons-list">${consHtml}</ul>
                            </div>
                        </div>

                        <a href="${hotel.agodaLink}" class="btn-agoda" target="_blank">Check Prices on Agoda</a>
                    </div>
                </div>
            `;
        });
        hotelGrid.innerHTML = html;
    }

    loadZones();
</script>

</body>
</html>
